[package]
name = "whisper-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "whisper_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["abi3-py38"] }
ct2rs = { version = "0.10", features = ["whisper"] }
wavekat-vad = { version = "0.1.16" }
symphonia = { version = "0.6", features = ["mp3", "isomp4", "aac", "flac", "vorbis", "wav", "pcm"] }
rubato = "5.0"
hf-hub = { version = "1.0", features = ["blocking"], default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi"] }
mel_spec = "0.3"
ndarray = "0.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
polyvoice = { version = "0.17", default-features = false, features = ["pipeline-full"], optional = true }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"], optional = true }
parakeet-rs = { version = "0.3", default-features = false, features = ["load-dynamic", "api-28"], optional = true }

[dev-dependencies]
hound = "3.5"

[features]
extension-module = ["pyo3/extension-module"]
silero-vad = ["wavekat-vad/silero"]
diarization = ["dep:polyvoice", "polyvoice/pipeline-full", "dep:ort", "ort/load-dynamic"]
nemotron = ["dep:parakeet-rs", "ort/load-dynamic"]
